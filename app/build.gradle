plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.jaimin.auraorbit'
    compileSdk rootProject.ext.androidCompileSdk

    defaultConfig {
        applicationId "dev.jaimin.auraorbit"
        minSdk rootProject.ext.androidMinSdk
        targetSdk rootProject.ext.androidTargetSdk
        versionCode 12
        versionName "3.2.0"
    }

    signingConfigs {
        release {
            storeFile System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : null
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    // Prevent compression of libGDX native libs
    androidResources {
        noCompress 'so'
    }

    packaging {
        // Avoid duplicate META-INF entries from libGDX transitive deps
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

configurations { natives }

dependencies {
    def gdxVersion = rootProject.ext.gdxVersion

    // ─── libGDX Core ────────────────────────────────────────────────────
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // ─── libGDX Android Backend (includes Live Wallpaper support) ──────
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    // ─── libGDX Android Native Libs (arm64, armeabi-v7a, x86_64, x86) ───
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"

    // ─── AndroidX ──────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // ─── Kotlin coroutines (background app-list loading off the main thread) ──
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // ─── Jetpack Compose ───────────────────────────────────────────────
    // BOM pins all Compose artifact versions together; keep this as the
    // single source of truth when bumping Compose.
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    // Lets legacy Activities (SphereModeActivity extends AndroidApplication,
    // NOT ComponentActivity) still host Compose content via ComposeView.
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'

    // ─── Settings UI / Activity Result APIs ───────────────────────────
    implementation 'androidx.activity:activity:1.9.3'

    // ─── Hidden API Bypass ─────────────────────────────────────────────
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // ─── Unit tests (GroupStore runs on host JVM; org.json is stubbed
    //     in android.jar, so pull the real artifact for tests) ─────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}


tasks.register('copyNatives') {
    doFirst {
        file("src/main/jniLibs").mkdirs()
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("src/main/jniLibs/arm64-v8a")
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("src/main/jniLibs/armeabi-v7a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("src/main/jniLibs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("src/main/jniLibs/x86")
            
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn 'copyNatives'
    }
}
