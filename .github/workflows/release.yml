name: Release

on:
  push:
    branches:
      - main

# Queue overlapping runs instead of letting them race each other (two pushes
# in quick succession both force-moving the same tag / uploading to the same
# release at once would be a mess). A newer push does NOT cancel a release
# already in progress — an in-flight signed-APK build/upload should never be
# killed mid-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from build.gradle
        id: version
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -oP '(?<=versionName ").*(?=")' app/build.gradle)
          VERSION_CODE=$(grep -oP '(?<=versionCode )\d+' app/build.gradle)

          # Fail fast with a clear message instead of silently proceeding
          # with an empty/malformed value that would only surface much later
          # as a confusing git-tag or release-upload error.
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          if [[ -z "$VERSION_CODE" ]]; then
            echo "::error::Could not read versionCode from app/build.gradle"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName '$VERSION_NAME' is not in X.Y.Z format"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode '$VERSION_CODE' is not a plain integer"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi

          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --ignore-garbage -d > "$RUNNER_TEMP/keystore.jks"

          # An empty/corrupt decode (e.g. the secret was truncated or not
          # valid base64) would otherwise surface much later as an opaque
          # Gradle signing failure. Catch it here instead.
          if [[ ! -s "$RUNNER_TEMP/keystore.jks" ]]; then
            echo "::error::Decoded keystore is empty — check the KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease

          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Expected APK not found at $APK_PATH after assembleRelease"
            exit 1
          fi

      - name: Rename APK to match F-Droid Binaries URL pattern
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "AuraOrbit-${{ steps.version.outputs.VERSION_NAME }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraOrbit-${{ steps.version.outputs.VERSION_NAME }}
          path: AuraOrbit-${{ steps.version.outputs.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Create or move git tag
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always release on every push. If versionName in build.gradle
          # wasn't bumped since the last push, TAG already exists — rather
          # than skip, force-move it to this commit so the tag (and the
          # GitHub Release created below, which softprops/action-gh-release
          # updates in place for an existing tag) always reflect the latest
          # build for that version.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — moving it to this commit."
          else
            echo "Tag $TAG is new."
          fi

          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.TAG }}"
          files: AuraOrbit-${{ steps.version.outputs.VERSION_NAME }}.apk
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
